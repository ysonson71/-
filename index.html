<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 연동 테스트</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: #1e293b; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.95rem; line-height: 1.5; }
    .status {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">👋</div>
    <h1>환영합니다. 손손님!</h1>
    <p>GitHub 연동 및 모바일 연결 테스트가 성공했습니다.</p>
    <div class="status" id="time"></div>
  </div>
  <script>
    document.getElementById('time').textContent = '최근 갱신: ' + new Date().toLocaleTimeString('ko-KR');
  </script>
</body>
</html>
